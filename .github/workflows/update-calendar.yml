name: Update Binance Alpha Calendar

"on":
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Refresh calendar
        run: |
          python3 scripts/update_binance_alpha_calendar.py \
            --cms-pages 1 \
            --cms-page-size 20 \
            --social-posts 12

      - name: Add landing page
        run: |
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Binance Wallet Alpha 空投日历</title>
          </head>
          <body>
            <h1>Binance Wallet Alpha 空投日历</h1>
            <p>Apple Calendar 订阅地址：</p>
            <p><a href="./binance-alpha-airdrops.ics">binance-alpha-airdrops.ics</a></p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
