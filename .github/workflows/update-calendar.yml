name: Update Binance Alpha Calendar
run-name: Update Binance Alpha Calendar (${{ github.event.inputs.source || github.event_name }})

"on":
  push:
    branches:
      - main
  schedule:
    # GitHub can delay or drop scheduled runs during busy minutes.
    # Stagger away from :00/:30 and run more often so a missed tick is less costly.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Trigger source label"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-calendar
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh calendar
        run: |
          echo "Trigger source: $TRIGGER_SOURCE"
          python3 scripts/update_binance_alpha_calendar.py \
            --cms-pages 1 \
            --cms-page-size 20 \
            --social-posts 12 \
            --notify-feishu
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.source || github.event_name }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd public
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update calendar feed ${GITHUB_RUN_ID}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
