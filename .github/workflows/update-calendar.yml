name: Update Binance Alpha Calendar
run-name: Update Binance Alpha Calendar (${{ github.event.inputs.source || github.event_name }})

"on":
  push:
    branches:
      - main
  schedule:
    # GitHub can delay or drop scheduled runs during busy minutes.
    # Stagger away from :00/:30 and run more often so a missed tick is less costly.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Trigger source label"
        required: false
        default: "manual"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Refresh calendar
        run: |
          echo "Trigger source: $TRIGGER_SOURCE"
          python3 scripts/update_binance_alpha_calendar.py \
            --cms-pages 1 \
            --cms-page-size 20 \
            --social-posts 12
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.source || github.event_name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
